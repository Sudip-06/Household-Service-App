<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #eef2f7;
        }
        h2 {
            font-weight: bold;
            color: #4a69bd;
        }
        .card {
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.1);
            border: none;
            margin-bottom: 20px;
            border-radius: 15px;
        }
        .card:hover {
            transform: scale(1.02);
            transition: all 0.3s;
        }
        .table {
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }
        .table th {
            background-color: #4a69bd;
            color: #ffffff;
        }
        .btn-primary, .btn-danger, .btn-success {
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Flash Messages Container -->
    <div class="flash-container">
        {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} d-flex justify-content-between align-items-center alert-dismissible fade show mb-1" role="alert">
                <span>{{ message }}</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <div class="container mt-5">
        <h2 class="text-center mb-4">My Profile</h2>

        <!-- Edit Profile Section -->
        <div class="card p-4">
            <h4 class="card-title text-center mb-3">Edit Profile</h4>
            <form action="{{ url_for('update_professional_profile') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Name</label>
                    <input type="text" id="username" name="username" class="form-control" value="{{ professional.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" value="{{ professional.email }}" disabled>
                </div>
                <div class="mb-3">
                    <label for="phone_no" class="form-label">Phone Number</label>
                    <input type="number" id="phone_no" name="phone_no" class="form-control" value="{{ professional.phone_no }}" required>
                </div>
                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <select id="city" name="city" class="form-select" required>
                        <option value="" disabled>Select your city</option>
                        {% for city in cities %}
                        <option value="{{ city }}" {% if city == professional.city %}selected{% endif %}>{{ city }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" id="description" name="description" class="form-control" value="{{ professional.description }}" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
