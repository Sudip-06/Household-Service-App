<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Custom styling for the modal */
        .modal-content {
            padding: 20px;
            border-radius: 8px;
        }
        

        /* Login form container */
        .login-container {
            width: 300px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
        }

        /* Style for the password visibility toggle */
        .password-toggle {
            display:flex;
            align-items: center;
            justify-content: space;
            margin-top: -9px;
            margin-bottom: 10px;
            font-size: 10px;
            margin-left:;
        }
        .password-toggle input[type="checkbox"] {
            margin-left: 10px;
        }



        /* Style for additional links */
        .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }

        .extra-links a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 14px;
            margin-left: 17px;
            margin-right: 16px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

    <!-- Button to trigger modal -->
    <div class="d-flex justify-content-center mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#loginModal">
            Login
        </button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="#" method="POST">
                        <!-- Role Selection Dropdown -->
                        <div class="mb-3">
                            <select class="form-select" required>
                                <option value="" disabled selected>Select Your Role</option>
                                <option value="customer">Customer</option>
                                <option value="service-professional">Service Professional</option>
                                <option value="admin">Admin</option> 
                            </select>
                        </div>

                        <!-- Email Input -->
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" required>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <input type="password" id="password" class="form-control" placeholder="Password" required>
                        </div>

                        <!-- Password visibility toggle -->
                        <label class="password-toggle">
                            <input type="checkbox" onclick="togglePasswordVisibility('password')"> Show Password
                        </label>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
                
                    <div class="extra-links">
                        <a href="Forgot password.html">Forgot Password?</a>
                        <a href="sign up.html">Sign Up</a>
                    </div>
                
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
        // Function to toggle password visibility
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
            } else {
                field.type = "password";
            }
        }
    </script>

</body>
</html>
