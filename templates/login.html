<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Style for the overall page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Login form container */
        .login-container {
            width: 300px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
        }

        /* Flash messages container styling */
        .flash-container {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* Success messages in green */
        .flash-container .alert-success {
            color: green
        }

        /* Error messages in red */
        .flash-container .alert-error {
            color: red
        }

        /* Heading style */
        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Style for input fields and dropdowns */
        .login-container input[type="text"],
        .login-container input[type="email"],
        .login-container input[type="password"],
        .login-container select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Style for the role */
        .login-container select {
            width: 97%;
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Style for checkboxes */
        .show-password {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 14px;
            color: #333;
            margin: 5px 0;
        }

        /* Style for the Login button */
        .login-container button {
            width: 97%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        /* Hover effect for the Login button */
        .login-container button:hover {
            background-color: #45a049;
        }


        /* Style for the password visibility toggle */
        .password-toggle {
            display:flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -9px;
            margin-bottom: 10px;
            font-size: 10px;
            margin-left: 200px;
        }
        .password-toggle input[type="checkbox"] {
            margin-left: 10px;
        }

        /* Style for additional links */
        .login-container .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .login-container .extra-links a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 14px;
            margin-left: 5px;
            margin-right: 6px;
        }

        .login-container .extra-links a:hover {
            text-decoration: underline;
        }

    </style>

    <script>
        // Function to toggle password visibility for a specified input field
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
            } else {
                field.type = "password";
            }
        }
    </script>


</head>
<body>


<div class="login-container">
    <!-- Flash Messages Container -->
    <h2>Sign In</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" id="password" placeholder="Password" required>

        <!-- Password visibility toggle -->
        <label class="show-password">
            <input type="checkbox" onclick="togglePasswordVisibility('password')"> Show Password
        </label>
            <!-- Flash Messages Container -->
        <div class="flash-container">
            {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} d-flex justify-content-between align-items-center alert-dismissible fade show mb-1" role="alert">
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}
        </div>



        <button type="submit">Sign In</button>
    </form>
    

    <!-- Additional links for Forgot Password and Sign Up -->
    <div class="extra-links">
        <a href="Forgot password.html">Forgot Password?</a>
        <a href="{{url_for('signup')}}">Sign Up</a>
    </div>
</div>


</body>
</html>
