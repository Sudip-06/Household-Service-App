<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container booking-container">
    <h2 class="text-center mb-4">Book {{ service.name }}</h2>

    <form action="{{ url_for('submit_booking') }}" method="POST">
        <input type="hidden" name="service_id" value="{{ service.id }}">
    
        <div class="form-group">
            <label for="serviceName">Service Name</label>
            <input type="text" class="form-control" id="serviceName" value="{{ service.name }}" disabled>
        </div>
    
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" rows="3" disabled>{{ service.description }}</textarea>
        </div>
    
        <div class="form-group">
            <label for="price">Price</label>
            <input type="text" class="form-control" id="price" value="₹{{ service.price }}" disabled>
        </div>

        <!-- New fields for customer details -->
        <div class="form-group">
            <label for="customerName">Your Name</label>
            <input type="text" class="form-control" id="customerName" name="customer_name" value="{{ user.username }}" disabled>
        </div>
        <div class="form-group">
            <label for="customeremail" >Email</label>
            <input type="text" id="customeremail" name="customer_email" class="form-control" value="{{ user.email }}" disabled>
        </div>
        <div class="form-group">
            <label for="customerphone_no" >phone_no</label>
            <input type="text" id="customerphone_no" name="customer_phone_no" class="form-control" value="{{ user.phone_no }}" disabled>
        </div>
        <div class="form-group">
            <label for="customerCity">City</label>
            <input type="text" class="form-control" id="customerCity" name="customer_city" value="{{ user.city }}" disabled>
        </div>
        <div class="form-group">
            <label for="area" >Address</label>
            <input type="text" id="area" name="area" class="form-control" value="{{ user.area }}" disabled>
        </div>
        <div class="form-group">
            <label for="customerPincode">Pincode</label>
            <input type="text" class="form-control" id="customerPincode" name="customer_pincode" value="{{ user.pincode }}" disabled>
        </div>
    
        <div class="form-group">
            <label for="dateOfRequest">Date of Request</label>
            <input type="date" class="form-control" id="dateOfRequest" name="date_of_request" required>
        </div>
    
        <div class="form-group">
            <label for="remarks">Remarks (optional)</label>
            <textarea class="form-control" id="remarks" name="remarks" rows="3"></textarea>
        </div>
    
        <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
    </form>
</div>
</body>
</html>
