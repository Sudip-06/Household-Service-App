<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Update Service</h2>
    <form action="{{ url_for('update_service', service_id=service.id) }}" method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Service Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ service.name }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Service Description</label>
            <input type="text" class="form-control" id="description" name="description" value="{{ service.description }}" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Base Price</label>
            <input type="number" class="form-control" id="price" name="price" value="{{ service.price }}" required>
        </div>
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city" value="{{ service.city }}" required>
        </div>
        <div class="mb-3">
            <label for="time_required" class="form-label">Time Required (in hours)</label>
            <input type="number" class="form-control" id="time_required" name="time_required" value="{{ service.time_required }}" required>
        </div>
        <div class="mb-3">
            <label for="image_location" class="form-label">Service Icon</label>
            <input type="text" class="form-control" id="image_location" name="image_location" value="{{ service.image_location }}" >
        </div>
        <button type="submit" class="btn btn-success">Update Service</button>
        <a href="{{ url_for('manage_services') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
