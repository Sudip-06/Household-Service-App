<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* Add your CSS styling here as per your original structure */
        /* Style for the overall page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Sign-up form container */
        .signup-container {
            width: 300px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
        }

        /* Heading style */
        .signup-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Style for input fields and dropdowns */
        .signup-container input[type="text"],
        .signup-container input[type="number"],
        .signup-container input[type="email"],
        .signup-container input[type="password"],
        .signup-container select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Style for the role */
        .signup-container select {
            width: 97%;
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Style for checkboxes */
        .show-password {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 14px;
            color: #333;
            margin: 5px 0;
        }

        /* Style for the sign-up button */
        .signup-container button {
            width: 97%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        /* Hover effect for the sign-up button */
        .signup-container button:hover {
            background-color: #45a049;
        }

        /* Link style */
        .signup-container .login-link {
            display: block;
            margin-top: 15px;
            color: #4CAF50;
            text-decoration: none;
            font-size: 14px;
        }

        .signup-container .login-link:hover {
            text-decoration: underline;
        }

        /* Hidden service type section */
        .service-type-section {
            display: none;
        }

        /* Error message style */
        .error-message {
            color: red;
            font-size: 14px;
            display: none;
        }

        /* Style for the password visibility toggle */
        .password-toggle {
            display:flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -9px;
            margin-bottom: 10px;
            font-size: 10px;
            margin-left: 200px;
        }
        .password-toggle input[type="checkbox"] {
            margin-left: 10px;
        }

    </style>
</head>
<body>

<div class="signup-container">
    <h2>Sign Up</h2>
    
    <form action="/sign up.html" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>

        <label for="role"></label>
        <select id="role" name="role" required onchange="toggleServiceType()">
            <option value="" disabled selected>Select your role</option>
            <option value="customer">Customer</option>
            <option value="service_professional">Service Professional</option>
        </select>

        <!-- Service Type section that appears only for Service Professionals -->
        <div id="service-type-section" style="display: none;">
            <select id="service-type" name="service-type">
                <option value="" disabled selected>Select service type</option>
                <option value="plumbing">Plumbing</option>
                <option value="electrician">Electrician</option>
                <option value="cleaning">Cleaning</option>
                <option value="gardening">Gardening</option>
            
            <input type="number" min="0" max="42" name="experience" placeholder="Years Of Experience" required>
            <input type="text" name="description" placeholder="Description" required>
            </select>
        </div>

        <input type="text" name="city" placeholder="City" required>
        <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" placeholder="Enter 6-digit pincode" required>


        <input type="password" id="password" name="password" placeholder="Password" required>
        <!-- Password visibility toggle -->
        <label class="show-password">
            <input type="checkbox" onclick="togglePasswordVisibility('password')"> Show Password
        </label>

        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required>
        <!--Confirm Password visibility toggle -->
        <label class="show-password">
            <input type="checkbox" onclick="togglePasswordVisibility('confirm-password')"> Show Confirm Password
        </label>

        <!-- Error message for password mismatch -->
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
                <div>
                    {% for category, message in messages %}
                        <p class="{{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <button type="submit">Sign Up</button>
    </form>

    <a href="login.html" class="login-link">Already have an account? Log in</a>
</div>

<script>
    // Function to toggle the service type section based on the selected role
    function toggleServiceType() {
        const role = document.getElementById("role").value;
        const serviceTypeSection = document.getElementById("service-type-section");
        if (role === "service_professional") {
            serviceTypeSection.style.display = "block";
        } else {
            serviceTypeSection.style.display = "none";
        }
    }
</script>
<script>
    // Function to toggle password visibility for a specified input field
    function togglePasswordVisibility(fieldId) {
        const field = document.getElementById(fieldId);
        if (field.type === "password") {
            field.type = "text";
        } else {
            field.type = "password";
        }
    }
</script>
</body>
</html>
