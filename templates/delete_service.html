<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-danger">Delete Service</h2>
        <p class="lead">Are you sure you want to delete the service <strong>{{ service.name }}</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
        
        <form action="{{ url_for('delete_service', service_id=service.id) }}" method="POST">
            <button type="submit" class="btn btn-danger me-2">Confirm Delete</button>
            <a href="{{ url_for('manage_services') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
